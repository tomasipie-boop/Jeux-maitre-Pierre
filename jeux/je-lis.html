/* Concept : une ardoise de classe. Grandes cartes tactiles, une consigne à la fois, trois familles de couleur (l bleu, m orange, n vert) comme sur le memory. */
:root {
  --bg: #EEF3F8;
  --surface: #FFFFFF;
  --ink: #1B2838;
  --muted: #566679;
  --line: #C6D4E3;
  --accent: #1B3A66;
  --accent-ink: #FFFFFF;
  --l: #2B68C2; --l-t: #E1ECFA;
  --m: #C95A0B; --m-t: #FCE9DA;
  --n: #2A8049; --n-t: #DDF1E4;
  --p: #8143B5; --p-t: #EEE1F8;
  --r: #C0392B; --r-t: #FBE3DF;
  --s: #0B7F8C; --s-t: #D9F0F2;
  --t: #A56A00; --t-t: #FBEFD0;
  --ok: #2A8049; --ok-t: #DDF1E4;
  --ko: #B93A2C; --ko-t: #FBE3DF;
  --sans: "Andika", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --cursive: "Marelle", "Segoe Script", "Brush Script MT", cursive;
  --emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1721; --surface: #182331; --ink: #E8EEF5; --muted: #9BADC0; --line: #2C3E53;
    --accent: #8DB3EC; --accent-ink: #0E1620;
    --l: #7BAAF2; --l-t: #1D3452;
    --m: #F5A15C; --m-t: #432B18;
    --n: #6CCB8D; --n-t: #1B3D2A;
    --p: #C79BF0; --p-t: #3A2650;
    --r: #F28172; --r-t: #4A2420;
    --s: #5CCBD6; --s-t: #173D42;
    --t: #E8B84A; --t-t: #4A3A14;
    --ok: #6CCB8D; --ok-t: #1B3D2A;
    --ko: #F28172; --ko-t: #4A2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1721; --surface: #182331; --ink: #E8EEF5; --muted: #9BADC0; --line: #2C3E53;
  --accent: #8DB3EC; --accent-ink: #0E1620;
  --l: #7BAAF2; --l-t: #1D3452;
  --m: #F5A15C; --m-t: #432B18;
  --n: #6CCB8D; --n-t: #1B3D2A;
  --p: #C79BF0; --p-t: #3A2650;
  --r: #F28172; --r-t: #4A2420;
  --s: #5CCBD6; --s-t: #173D42;
    --t: #E8B84A; --t-t: #4A3A14;
  --ok: #6CCB8D; --ok-t: #1B3D2A;
  --ko: #F28172; --ko-t: #4A2420;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 1.05rem; line-height: 1.45;
  padding-block: 1rem 2.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 46rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.1rem; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 .lmn { font-family: var(--cursive); font-weight: 400; display: block; line-height: 1.7; font-size: 1.1em; padding-top: .2em; }
.sub { color: var(--muted); margin: .3rem 0 0; }
.l-c { color: var(--l); } .m-c { color: var(--m); } .n-c { color: var(--n); } .p-c { color: var(--p); }

/* Menu */
.levels { display: grid; gap: .8rem; }
.level {
  display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 1.1rem; padding: 1rem 1.1rem;
  min-height: 5.5rem; transition: transform .12s, border-color .12s;
}
.level:hover { border-color: var(--accent); transform: translateY(-2px); }
.level .ico { font-size: 2.4rem; line-height: 1; width: 3.4rem; text-align: center; font-family: var(--emoji); }
.level b { display: block; font-size: 1.2rem; }
.level span.d { color: var(--muted); font-size: .95rem; }
.opts { background: var(--surface); border: 2px solid var(--line); border-radius: 1.1rem; padding: 1rem 1.1rem; display: grid; gap: 1rem; }
.opts h2 { margin: 0 0 .45rem; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  min-width: 3.4rem; min-height: 3rem; padding: .3rem .9rem; border-radius: 999px; border: 2px solid var(--line);
  background: var(--bg); font-size: 1.15rem; font-weight: 700;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.fam[aria-pressed="true"].l { background: var(--l); border-color: var(--l); color: var(--surface); }
.chip.fam[aria-pressed="true"].m { background: var(--m); border-color: var(--m); color: var(--surface); }
.chip.fam[aria-pressed="true"].n { background: var(--n); border-color: var(--n); color: var(--surface); }
.chip.fam[aria-pressed="true"].p { background: var(--p); border-color: var(--p); color: var(--surface); }
.chip.fam[aria-pressed="true"].r { background: var(--r); border-color: var(--r); color: var(--surface); }
.chip.fam[aria-pressed="true"].s { background: var(--s); border-color: var(--s); color: var(--surface); }
.chip.fam[aria-pressed="true"].t { background: var(--t); border-color: var(--t); color: var(--surface); }
.voice-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
select { font: inherit; min-height: 3rem; border-radius: .7rem; border: 2px solid var(--line); background: var(--bg); color: var(--ink); padding: .2rem .6rem; max-width: 100%; }
.small { font-size: .88rem; color: var(--muted); margin: 0; }

/* Jeu */
.bar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.back { border: 2px solid var(--line); background: var(--surface); border-radius: .8rem; min-height: 2.8rem; padding: .2rem .9rem; }
.dots { display: flex; gap: .4rem; flex: 1; justify-content: center; min-width: 8rem; }
.dot { width: .9rem; height: .9rem; border-radius: 50%; background: var(--line); }
.dot.cur { background: var(--accent); transform: scale(1.25); }
.dot.good { background: var(--ok); }
.dot.bad { background: var(--ko); }
.score { font-weight: 700; font-family: var(--emoji), var(--sans); }
.stage { background: var(--surface); border: 2px solid var(--line); border-radius: 1.4rem; padding: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
.ask { margin: 0; font-size: 1.15rem; font-weight: 700; text-wrap: balance; }
.ear {
  width: 6.2rem; height: 6.2rem; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  font-size: 2.6rem; font-family: var(--emoji); display: grid; place-items: center; box-shadow: 0 .25rem 0 rgba(0,0,0,.18);
}
.ear:active { transform: translateY(2px); box-shadow: 0 .1rem 0 rgba(0,0,0,.18); }
.ear.mini { width: auto; height: auto; border-radius: .9rem; font-size: 1rem; padding: .55rem 1rem; font-family: var(--sans); box-shadow: none; }
.ear-row { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
.pic { font-family: var(--emoji); font-size: clamp(5rem, 24vw, 8rem); line-height: 1.1; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; width: 100%; }
.choice {
  min-height: 7.2rem; background: var(--bg); border: 3px solid var(--line); border-radius: 1.1rem;
  display: grid; place-items: center; padding: .4rem; transition: transform .1s;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:active:not(:disabled) { transform: scale(.97); }
.choice:disabled { cursor: default; }
.choice.ok { background: var(--ok-t); border-color: var(--ok); }
.choice.ko { background: var(--ko-t); border-color: var(--ko); opacity: .75; animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.syl { font-size: clamp(2.6rem, 13vw, 4.6rem); line-height: 1.15; }
.syl.b { font-family: var(--sans); font-weight: 400; }
.syl.c { font-family: var(--cursive); font-size: clamp(2.6rem, 13vw, 4.6rem); line-height: 1.3; }
.fb { min-height: 1.9rem; font-weight: 700; font-size: 1.2rem; text-align: center; margin: 0; }
.fb.ok { color: var(--ok); } .fb.ko { color: var(--ko); }
.next { align-self: center; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.25rem; min-height: 3.4rem; padding: .4rem 2rem; border-radius: 999px; }
.revealed { font-size: 1.6rem; display: flex; gap: .4rem; justify-content: center; flex-wrap: wrap; }

/* Mot en tuiles */
.tiles { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
.tile { min-width: 4.4rem; padding: .25rem .8rem; border: 3px solid var(--line); border-radius: .9rem; background: var(--bg); text-align: center; }
.tile .syl { font-size: clamp(2.2rem, 10vw, 3.6rem); }
.tile .syl.c { font-size: clamp(2.2rem, 10vw, 3.6rem); }
.tile.hit.l { background: var(--l-t); border-color: var(--l); }
.tile.hit.m { background: var(--m-t); border-color: var(--m); }
.tile.hit.n { background: var(--n-t); border-color: var(--n); }
.tile.hit.p { background: var(--p-t); border-color: var(--p); }
.tile.hit.r { background: var(--r-t); border-color: var(--r); }
.tile.hit.s { background: var(--s-t); border-color: var(--s); }
.tile.hit.t { background: var(--t-t); border-color: var(--t); }
.picimg { height: clamp(5rem, 24vw, 8rem); width: auto; display: block; margin-inline: auto; }
.read-card { min-height: 8rem; display: grid; place-items: center; width: 100%; background: var(--bg); border: 3px dashed var(--line); border-radius: 1.2rem; padding: .8rem; }
.read-card .syl { font-size: clamp(4rem, 20vw, 7rem); }
.big.mic { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; font-size: 1.5rem; min-height: 5rem; }
.big.mic.on { background: var(--ko); border-color: var(--ko); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.heard { min-height: 1.4rem; margin: 0; text-align: center; font-size: 1rem; opacity: .75; }
.linkbtn { background: none; border: 0; text-decoration: underline; font-size: 1rem; color: inherit; opacity: .8; padding: .6rem; align-self: center; }
.btns2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; width: 100%; }
.big { min-height: 4rem; border-radius: 1rem; border: 3px solid var(--line); background: var(--bg); font-weight: 700; font-size: 1.15rem; padding: .3rem .6rem; }
.big.go { background: var(--ok-t); border-color: var(--ok); }
.big.again { background: var(--ko-t); border-color: var(--ko); }
.big.check { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; font-size: 1.3rem; }
.target { display: inline-flex; align-items: center; gap: .8rem; background: var(--bg); border: 2px dashed var(--line); border-radius: 1rem; padding: .2rem 1rem; }
.target .syl { font-size: clamp(2.4rem, 11vw, 3.8rem); }
.pos { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: .8rem; width: 100%; }
.pos .choice { min-height: 6.4rem; gap: .3rem; align-content: center; }
.mini { display: flex; gap: .25rem; }
.mini i { width: 1.5rem; height: 1.1rem; border-radius: .3rem; border: 2px solid var(--muted); background: transparent; display: block; }
.mini i.on { background: var(--accent); border-color: var(--accent); }
.pos .lbl { font-weight: 700; font-size: 1.1rem; }

.end { align-items: center; }
.end .big { font-size: clamp(2.4rem, 10vw, 3.4rem); font-family: var(--emoji); letter-spacing: .1em; }
.end .row { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; }
.end .row button { border: 2px solid var(--line); background: var(--bg); border-radius: 999px; min-height: 3.2rem; padding: .3rem 1.4rem; font-weight: 700; }
.end .row button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 420px) {
  .choices { gap: .5rem; }
  .stage { padding: .9rem; }
}
@media (prefers-reduced-motion: reduce) {
  .choice, .level { transition: none; }
  .choice.ko { animation: none; }
}
</style>

      tapBtn('mic', '🔊 J’écoute le modèle…', false);
      sayQ(function () {
        if (st.qs[st.i] !== q || q.done) return;
        tapBtn('tapspeak', '🎤 À toi ! Lis.', true);
        setTimeout(function () { if (st.qs[st.i] === q && !q.done && !sess) tapSpeak(q, true); }, 700);
      });
      return;
    }
    setMic('🔊 J’écoute le modèle…', false);
    sayQ(function () {
      if (st.qs[st.i] !== q || q.done) return;
      setTimeout(function () {
        if (st.qs[st.i] !== q || q.done) return;
        vadV = 0; gate = true; gateT = Date.now(); setMic('🎤 À toi ! Répète.', true);
        if (want && !sess) startSession();
        armT = setTimeout(function () {
          if (st.qs[st.i] === q && !q.done && gate) judge(q, [''], false);
        }, 8000);
      }, 800);
    });
  }
  function judge(q, alts, ok) {
    if (q.done || st.qs[st.i] !== q) return;
    gate = false; clearTimeout(armT);
    var fb = document.getElementById('fb'), hd = document.getElementById('heard');
    hd.textContent = 'J’ai entendu : « ' + (alts[0] || '') + ' »';
    if (ok) {
      q.done = true; st.res[st.i] = 1; st.score++;
      sOk(); app.querySelector('.score').textContent = '⭐ ' + st.score;
      fb.className = 'fb ok'; fb.textContent = 'Bravo !'; setMic('✓ Bravo !', false);
      var rp = document.getElementById('rpic'); if (rp) rp.hidden = false;
      clearTimeout(st.timer); st.timer = setTimeout(function () { if (st.qs[st.i] === q) next(); }, 1400);
    } else {
      q.att = (q.att || 0) + 1;
      var said = alts.join('').replace(/\s/g, '');
      if (said) { q.last = alts.slice(); LOG.push({ t: q.answer, h: alts.slice(0, 3) }); if (LOG.length > 60) LOG.shift(); lsSet('lis-log', LOG); }
      else q.last = q.last || [''];
      if (q.att >= 2) { var fz = document.getElementById('force'); if (fz) fz.hidden = false; }
      if (q.att >= 3) {
        q.done = true; st.res[st.i] = 0;
        fb.className = 'fb ok'; fb.textContent = 'Bravo d’avoir osé ! On passe au suivant.'; setMic('👏 Bravo d’avoir osé !', false);
        var rp2 = document.getElementById('rpic'); if (rp2) rp2.hidden = false;
        sayQ();
        clearTimeout(st.timer); st.timer = setTimeout(function () { if (st.qs[st.i] === q) next(); }, 2800);
      } else {
        fb.className = 'fb ko'; fb.textContent = said ? 'Presque ! Écoute encore et répète.' : 'Je n’ai pas bien entendu. On réessaie !';
        setTimeout(function () { modelThenListen(q); }, 800);
      }
    }
  }
  function sayQ(cb) {
    var q = st.qs[st.i]; if (!q) return;
    if (q.type === 1 || (q.type === 4 && q.kind === 'syl')) say(q.answer, 0.7, cb); else say(q.word.w.toLowerCase(), 0.8, cb);
  }

  function famOf(s) { return s.charAt(0); }
  function answer(btn, v) {
    var q = st.qs[st.i]; if (q.done) return;
    var fb = document.getElementById('fb');
    var all = Array.prototype.slice.call(app.querySelectorAll('[data-act="ans"]'));
    function reveal(good) {
      q.done = true;
      all.forEach(function (b) { b.disabled = true; if (b.getAttribute('data-v') === q.answer) b.classList.add('ok'); });
      if (q.type === 2) {
        var rev = document.getElementById('rev');
        rev.hidden = false;
        rev.innerHTML = tilesHTML(q.word, styleFor() === 'c' ? 'c' : 'b', 0, famOf(q.answer));
      }
      if (q.type === 3) {
        var tiles = app.querySelectorAll('.tile');
        if (tiles[q.idx]) tiles[q.idx].classList.add('hit', famOf(q.target));
      }
      st.res[st.i] = good ? 1 : 0;
      document.getElementById('next').hidden = false;
      document.getElementById('next').focus({ preventScroll: true });
    }
    if (v === q.answer) {
      if (q.tries === 0) st.score++;
      sOk(); fb.className = 'fb ok'; fb.textContent = q.tries === 0 ? 'Bravo !' : 'Oui, c’est ça !';
      reveal(q.tries === 0);
      app.querySelector('.score').textContent = '⭐ ' + st.score;
      if (q.type !== 1) setTimeout(function () { say(q.word.w.toLowerCase(), 0.8); }, 400);
      document.getElementById('next').hidden = true;
      clearTimeout(st.timer);
      st.timer = setTimeout(function () { if (st.qs[st.i] === q && q.done) next(); }, q.type === 1 ? 1100 : 2200);
    } else {
      q.tries++;
      btn.classList.add('ko'); btn.disabled = true; sKo();
      var left = all.filter(function (b) { return !b.disabled; });
      if (left.length <= 1) {
        fb.className = 'fb ko'; fb.textContent = 'C’était celle-ci.';
        reveal(false);
      } else {
        fb.className = 'fb ko'; fb.textContent = 'Écoute encore et essaie une autre.';
        setTimeout(sayQ, 500);
      }
    }
  }
  function next() {
    clearTimeout(st.timer);
    st.i++;
    if (st.i >= st.qs.length) renderEnd(); else renderQ();
  }
  function renderEnd() {
    stopSession(); stopVAD(); closeStream();
    var stars = '', n = st.score, tot = st.qs.length;
    for (var k = 0; k < tot; k++) stars += k < n ? '⭐' : '☆';
    var msg = n === tot ? 'Parfait ! Tout du premier coup.' : (n >= tot * 0.6 ? 'Très bien, continue !' : 'On rejoue pour progresser.');
    app.innerHTML = barHTML().replace(/<div class="dots".*?<\/div>/, '<div class="dots"></div>') +
      '<section class="stage end"><p class="ask">Bravo, la partie est finie.</p><div class="big" aria-label="' + n + ' sur ' + tot + '">' + stars + '</div>' +
      '<p class="ask">' + n + ' sur ' + tot + ' reconnus. Bravo d’avoir osé lire à voix haute !</p>' +
      '<div class="row"><button class="primary" data-act="start" data-v="' + st.level + '">Rejouer</button><button data-act="menu">Menu</button></div></section>';
    sOk();
  }
  function start(level) {
    if (level !== 4 && level !== 5) stopSession();
    st.level = level; st.qs = build(level); st.i = 0; st.score = 0; st.res = [];
    if (!st.qs.length) { renderMenu(); return; }
    renderQ();
  }

  /* Événements */
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (act === 'start') start(parseInt(v, 10));
    else if (act === 'menu') renderMenu();
    else if (act === 'say') sayQ();
    else if (act === 'saysyl') say(st.qs[st.i].target, 0.7);
    else if (act === 'ans') answer(el, v);
    else if (act === 'srec') { var qr = st.qs[st.i]; if (qr && !qr.done) startRec(qr); }
    else if (act === 'sok') {
      var qo = st.qs[st.i];
      if (qo && !qo.done) {
        qo.done = true; cancelRec(); st.res[st.i] = 1; st.score++; sOk();
        app.querySelector('.score').textContent = '⭐ ' + st.score;
        sMsg('Bravo !'); clearTimeout(st.timer); st.timer = setTimeout(function () { if (st.qs[st.i] === qo) next(); }, 700);
      }
    }
    else if (act === 'sagain') { var qa = st.qs[st.i]; if (qa && !qa.done) { sMsg('On réécoute le modèle, puis tu réessaies.'); var sb1 = document.getElementById('sbtns'); if (sb1) sb1.hidden = true; sayQ(); } }
    else if (act === 'tapspeak') { var qt = st.qs[st.i]; if (qt && !qt.done) tapSpeak(qt, false); }
    else if (act === 'mic') { var qm = st.qs[st.i]; if (qm && !qm.done) modelThenListen(qm); }
    else if (act === 'force') {
      var qf = st.qs[st.i];
      if (qf && !qf.done && qf.last) {
        var L = LEARN[String(qf.answer).toLowerCase()] = LEARN[String(qf.answer).toLowerCase()] || [];
        qf.last.filter(function (a) { return String(a).trim(); }).forEach(function (a) { [phon(a)].concat(String(a).split(/[\s'’\-.,]+/).map(phon)).forEach(function (w) { if (w && L.indexOf(w) < 0) L.push(w); }); });
        lsSet('lis-learn', LEARN);
        judge(qf, qf.last, true);
      }
    }
    else if (act === 'mictest') {
      var tx = document.getElementById('mictxt');
      if (!SR) { tx.textContent = 'Ce navigateur ne sait pas écouter : ouvre le jeu dans Chrome.'; return; }
      stopSession();
      var tr = new SR(); tr.lang = 'fr-FR'; tr.interimResults = true; tr.continuous = false; var heardT = false;
      tr.onstart = function () { tx.textContent = '🎤 J’écoute… dis « bonjour » ou « maman ».'; };
      tr.onresult = function (ev) { heardT = true; tx.textContent = '✅ Le micro marche. J’ai entendu : « ' + ev.results[ev.results.length - 1][0].transcript + ' »'; };
      tr.onerror = function (ev) { heardT = true; tx.textContent = '❌ ' + micHelp(ev.error); };
      tr.onend = function () { if (!heardT) tx.textContent = 'Je n’ai rien entendu. Vérifie que le bon micro (casque) est choisi dans les réglages du son, puis réessaie.'; };
      tx.textContent = 'Autorise le micro si Chrome le demande…';
      try { tr.start(); } catch (e) { tx.textContent = '❌ ' + micHelp('start'); }
    }
    else if (act === 'copylog') {
      var txt = LOG.map(function (e) { return e.t + ' -> ' + e.h.join(' | '); }).join('\n');
      var ok = function () { el.textContent = 'Copié ✓'; };
      try { navigator.clipboard.writeText(txt).then(ok, function () { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); }); } catch (e) {}
    }
    else if (act === 'clearlog') { LOG = []; LEARN = {}; lsSet('lis-log', []); lsSet('lis-learn', {}); renderMenu(); }
    else if (act === 'skip') { var qs = st.qs[st.i]; if (qs && !qs.done) { qs.done = true; gate = false; st.res[st.i] = 0; next(); } }
    else if (act === 'verif') {
      var q4 = st.qs[st.i]; sayQ();
      var rp = document.getElementById('rpic'); if (rp) rp.hidden = false;
      document.getElementById('rb').hidden = false; el.hidden = true;
    } else if (act === 'rok') {
      var q5 = st.qs[st.i]; if (q5.done) return; q5.done = true;
      if (!q5.redo) { st.score++; st.res[st.i] = 1; } else { st.res[st.i] = 0; }
      sOk(); app.querySelector('.score').textContent = '\u2B50 ' + st.score;
      var fb5 = document.getElementById('fb'); fb5.className = 'fb ok'; fb5.textContent = 'Bravo !';
      var rp5 = document.getElementById('rpic'); if (rp5) rp5.hidden = false;
      clearTimeout(st.timer); st.timer = setTimeout(function () { if (st.qs[st.i] === q5) next(); }, q5.kind === 'word' ? 1500 : 900);
    } else if (act === 'redo') {
      var q6 = st.qs[st.i]; q6.redo = true;
      sayQ();
    }
    else if (act === 'next') next();
    else if (act === 'test') say('lune', 0.8);
    else if (act === 'fam') {
      var on = famOn();
      if (st.fam[v] && on.length === 1) return;
      st.fam[v] = !st.fam[v]; savePrefs();
      el.setAttribute('aria-pressed', String(!!st.fam[v]));
    } else if (act === 'micmode') {
      var g = el.getAttribute('data-g'); st['mic' + g] = v; savePrefs();
      app.querySelectorAll('[data-act="micmode"][data-g="' + g + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v)); });
    } else if (act === 'ecr') {
      st.ecr = v; savePrefs();
      app.querySelectorAll('[data-act="ecr"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v)); });
    }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'voice') { st.voice = e.target.value; savePrefs(); say('lune', 0.8); }
  });

  renderMenu();
})();
</script>
