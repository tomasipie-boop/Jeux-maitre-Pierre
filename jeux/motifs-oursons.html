<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Motifs des oursons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Playwrite+FR+Trad:wght@300;400&display=swap">
<style>
:root{
  --bg:#EDF1F7; --panel:#FFFFFF; --ink:#1E2433; --muted:#5E6679;
  --tray:#5B606C; --tray-in:#FFFFFF; --slot:#C9CEDA; --accent:#2B4BA3; --accent-ink:#FFFFFF;
  --ok:#1F9D55; --no:#D93A3A; --chip:#E1E7F2;
  --red:#ED1C24; --orange:#F7941D; --yellow:#FFE500; --green:#39B54A; --blue:#00AEEF; --purple:#7F3F98;
  --dot:min(clamp(46px, 11.5vw, 118px), 10.5vh);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#141926; --panel:#1E2536; --ink:#EEF1F8; --muted:#A5AEC2; --tray:#8C93A5; --tray-in:#252D40;
    --slot:#46506A; --accent:#7F9CF0; --accent-ink:#10162A; --ok:#4CCB84; --no:#FF6B6B; --chip:#2A3348;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141926; --panel:#1E2536; --ink:#EEF1F8; --muted:#A5AEC2; --tray:#8C93A5; --tray-in:#252D40;
  --slot:#46506A; --accent:#7F9CF0; --accent-ink:#10162A; --ok:#4CCB84; --no:#FF6B6B; --chip:#2A3348;}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Andika","Comic Sans MS",system-ui,sans-serif;font-size:18px;}
.app{min-height:100%;display:flex;flex-direction:column;gap:clamp(12px,2.2vh,24px);padding-inline:16px;padding-block:16px 20px;max-width:1200px;margin:0 auto;box-sizing:border-box}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
h1{margin:0;font-family:"Playwrite FR Trad",cursive;font-weight:400;font-size:clamp(28px,4.4vw,52px);line-height:1.5;text-wrap:balance}
h1 .code{font-family:"Andika",sans-serif;font-weight:400;letter-spacing:.06em;margin-right:.35em}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stars{font-size:clamp(20px,2.6vw,30px);font-weight:700;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stars svg{width:1.3em;height:1.3em}

.bar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--chip);padding:5px;border-radius:999px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:clamp(16px,1.8vw,22px);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg-label{font-size:14px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.icon-btn{border:2px solid var(--chip);background:var(--panel);color:var(--ink);border-radius:999px;min-height:48px;padding:0 16px;font:inherit;font-size:18px;display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.icon-btn svg{width:24px;height:24px}
.icon-btn[aria-pressed="false"]{opacity:.55}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,34px)}
.consigne{font-size:clamp(20px,2.6vw,34px);text-align:center;margin:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.consigne button{flex:none}
.rowwrap{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.rowlabel{font-size:14px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tray{display:flex;gap:calc(var(--dot)*.22);padding:calc(var(--dot)*.2) calc(var(--dot)*.24);background:var(--tray-in);border:calc(var(--dot)*.07) solid var(--tray);border-radius:calc(var(--dot)*.28);box-shadow:inset 0 0 0 calc(var(--dot)*.04) var(--tray-in),inset 0 0 0 calc(var(--dot)*.06) var(--tray);max-width:100%;box-sizing:border-box}
.slot{width:var(--dot);height:calc(var(--dot)*1.08);border-radius:calc(var(--dot)*.16);border:0;box-sizing:border-box;background:transparent;padding:0 0 calc(var(--dot)*.04);cursor:default;position:relative;flex:none;display:flex;align-items:flex-end;justify-content:center}
.slot.empty{border:3px dashed var(--slot)}
.bear{display:block;width:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.bear.L{height:96%} .bear.M{height:72%} .bear.S{height:50%}
.slot.next{border-color:var(--accent);border-style:solid;animation:pulse 1.3s ease-in-out infinite}
.slot.placed{cursor:pointer}
.slot .let{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);font-size:calc(var(--dot)*.28);font-weight:700;color:var(--muted)}
.slot.pop{animation:pop .28s ease-out}
.slot.bad{animation:shake .45s ease-in-out 2;box-shadow:0 0 0 5px var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.slot.good{box-shadow:0 0 0 5px var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.lettered .tray{padding-bottom:calc(var(--dot)*.2 + var(--dot)*.4)}
.slot.next{background:color-mix(in srgb,var(--accent) 8%,transparent)}

.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,1.6vw,20px);background:var(--panel);padding:clamp(10px,1.8vw,18px) clamp(14px,2.4vw,28px);border-radius:28px;box-shadow:0 2px 0 var(--chip)}
.pgroup{display:flex;align-items:flex-end;gap:2px}
.gom{width:calc(var(--dot)*.78);height:calc(var(--dot)*.86);border-radius:14px;border:0;background:transparent;cursor:pointer;padding:0 0 4px;transition:transform .12s;display:flex;align-items:flex-end;justify-content:center}
.gom:hover{transform:translateY(-3px)}
.gom:active{transform:scale(.92)}
.gom:focus-visible,.seg button:focus-visible,.icon-btn:focus-visible,.slot:focus-visible,.big:focus-visible{outline:4px solid var(--accent);outline-offset:4px}

.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:64px}
.big{border:0;border-radius:999px;font:inherit;font-weight:700;font-size:clamp(20px,2.4vw,30px);padding:12px 30px;min-height:64px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;background:var(--chip);color:var(--ink)}
.big.primary{background:var(--accent);color:var(--accent-ink)}
.big svg{width:1.2em;height:1.2em}

.feedback{min-height:1.6em;font-size:clamp(22px,3vw,38px);font-weight:700;text-align:center;margin:0}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--no)}

.progress{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:min(100%,420px)}
.progress i{width:clamp(20px,2.4vw,30px);height:clamp(20px,2.4vw,30px);border-radius:50%;border:2.5px dashed var(--slot);box-sizing:border-box;display:block}
.progress i.on{border:0;animation:pop .35s ease-out;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
.progress i.cur{border-color:var(--accent);border-style:solid}
.finish{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:16px}
.finish-card{background:var(--panel);border:6px solid var(--tray);border-radius:36px;padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:640px}
.finish-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.finish-dots i{width:clamp(34px,5vw,60px);height:clamp(34px,5vw,60px);display:block;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
.finish-title{margin:0;font-family:"Playwrite FR Trad",cursive;font-size:clamp(40px,7vw,80px);line-height:1.6}
.finish-sub{margin:0;font-size:clamp(20px,2.6vw,32px)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){ :root{--dot:clamp(36px,11vw,60px)} .tray{gap:calc(var(--dot)*.14)} }
</style>

<div class="app" id="app">
  <header>
    <h1><span class="code" id="codeTitle">AAB</span>motifs répétitifs</h1>
    <div class="tools">
      <div class="progress" id="progress" aria-live="polite"></div>
      <button class="icon-btn" id="voiceBtn" aria-pressed="true" title="Voix">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span id="voiceTxt">Voix</span>
      </button>
      <button class="icon-btn" id="lettersBtn" aria-pressed="false" title="Afficher les lettres A B C">A B C</button>
    </div>
  </header>

  <div class="bar">
    <div class="group"><span class="seg-label">Jeu</span>
      <div class="seg" id="modeSeg">
        <button id="m-continuer" data-mode="continuer" aria-pressed="true">Continuer</button>
        <button id="m-reproduire" data-mode="reproduire" aria-pressed="false">Reproduire</button>
        <button id="m-creer" data-mode="creer" aria-pressed="false">Créer</button>
      </div>
    </div>
    <div class="group" id="lenGroup"><span class="seg-label">Série</span>
      <div class="seg" id="lenSeg">
        <button id="s-5" data-len="5" aria-pressed="true">5</button>
        <button id="s-10" data-len="10" aria-pressed="false">10</button>
      </div>
    </div>
  </div>

  <div class="finish" id="finish" hidden>
    <div class="finish-card">
      <div class="finish-dots" id="finishDots" aria-hidden="true"></div>
      <p class="finish-title">Bravo !</p>
      <p class="finish-sub" id="finishSub">Tu as réussi toute la série.</p>
      <button class="big primary" id="againBtn">Nouvelle série</button>
    </div>
  </div>

  <main id="main">
    <p class="consigne"><span id="consigne">Continue le motif.</span>
      <button class="icon-btn" id="sayBtn" title="Écouter la consigne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>Écouter</button>
    </p>
    <div id="board" style="display:flex;flex-direction:column;gap:clamp(14px,3vh,30px);align-items:center;max-width:100%"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <div class="palette" id="palette" aria-label="Gommettes"></div>
    <div class="actions">
      <button class="big" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Effacer</button>
      <button class="big" id="nextBtn">Passer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </main>
</div>

  {id:'red',name:'rouge',hex:'#E3202A'},{id:'blue',name:'bleu',hex:'#1F5FD1'},
  {id:'yellow',name:'jaune',hex:'#FFD400'},{id:'green',name:'vert',hex:'#1E8C2E'},
  {id:'orange',name:'orange',hex:'#FF6A13'}
];
const SIZES = [{id:'L',name:'grand'},{id:'M',name:'moyen'},{id:'S',name:'petit'}];
const ITEMS = []; COLS.forEach(c=>SIZES.forEach(s=>ITEMS.push({id:c.id+'-'+s.id, col:c.id, size:s.id, name:`${s.name} ours ${c.name}`})));
const byId = Object.fromEntries(ITEMS.map(x=>[x.id,x]));
const CODES = ['AB','AAB','ABB','ABC'];
const LEN = 6;
const CONSIGNES = {continuer:"Continue le motif.", reproduire:"Reproduis le motif.", creer:"Invente ton motif."};

let state = {mode:'continuer', voice:true, letters:false, series:5, won:[]};
let round = null;
let lastCode = null, lastKey = null, lastPlaced = -1, advanceTimer = null;
const $ = id => document.getElementById(id);

/* ---------- son : voix enregistrée, jouée clip par clip ---------- */
const audioCache = {};
let queue = [], current = null, onQueueEnd = null;
function clip(k){ if(!audioCache[k]){ const a=new Audio(CLIPS[k]); a.preload='auto'; audioCache[k]=a; } return audioCache[k]; }
function stopAudio(){ queue=[]; onQueueEnd=null; if(current){ try{current.pause(); current.currentTime=0;}catch(e){} current=null; } }
function playNext(){
  if(!queue.length){ current=null; const f=onQueueEnd; onQueueEnd=null; if(f) f(); return; }
  const k = queue.shift(); const a = clip(k); current = a;
  try{ a.currentTime=0; }catch(e){}
  a.onended = ()=>setTimeout(playNext, 280);
  const p = a.play(); if(p && p.catch) p.catch(()=>{ setTimeout(playNext, 0); });
}
function speak(keys, done){
  stopAudio();
  if(!state.voice){ if(done) setTimeout(done, 900); return; }
  queue = keys.filter(k=>CLIPS[k]); onQueueEnd = done||null; playNext();
}
function unlock(){ Object.keys(CLIPS).forEach(k=>clip(k).load()); document.removeEventListener('pointerdown', unlock); }
document.addEventListener('pointerdown', unlock);

/* ---------- ours ---------- */
function bearImg(id){ const it=byId[id]; const im=document.createElement('img'); im.src=IMG[it.col]; im.alt=it.name; im.className='bear '+it.size; im.draggable=false; return im; }

/* ---------- motifs (toujours au hasard) ---------- */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const pick = a => a[Math.floor(Math.random()*a.length)];
function buildModel(){
  let code; do { code = pick(CODES); } while(code===lastCode); lastCode = code;
  const n = code.includes('C') ? 3 : 2;
  /* ce qui change : la couleur, la taille, ou les deux */
  const kind = pick(['couleur','taille','les deux']);
  let units, key;
  do {
    if(kind==='couleur'){ const s=pick(SIZES).id; units=shuffle(COLS).slice(0,n).map(c=>c.id+'-'+s); }
    else if(kind==='taille'){ const c=pick(COLS).id; units=shuffle(SIZES).slice(0,n).map(s=>c+'-'+s.id); }
    else { const cs=shuffle(COLS).slice(0,n), ss=shuffle(SIZES).slice(0,n); units=cs.map((c,i)=>c.id+'-'+ss[i].id); }
    key = units.join();
  } while(key===lastKey);
  lastKey = key;
  const map = {A:units[0],B:units[1],C:units[2]};
  const unit = code.split('').map(l=>map[l]);
  return {code, model:Array.from({length:LEN},(_,i)=>unit[i%unit.length])};
}
function lettersOf(seq){ const m={}; let n=0; return seq.map(id=>{ if(id==null) return ''; if(!(id in m)) m[id]='ABC'[n++]||'?'; return m[id]; }); }

/* ---------- série ---------- */
function mini(el,id){ el.style.backgroundImage=`url(${IMG[byId[id].col]})`; }
function renderProgress(){
  const el=$('progress'); el.innerHTML='';
  el.hidden = state.mode==='creer';
  for(let i=0;i<state.series;i++){
    const d=document.createElement('i');
    if(state.won[i]){ d.className='on'; mini(d,state.won[i]); }
    else if(i===state.won.length) d.className='cur';
    el.appendChild(d);
  }
  el.setAttribute('aria-label', `${state.won.length} sur ${state.series}`);
}
function newSeries(){ state.won=[]; $('finish').hidden=true; newRound(); }
function showFinish(){
  const fd=$('finishDots'); fd.innerHTML='';
  state.won.forEach(id=>{ const d=document.createElement('i'); mini(d,id); fd.appendChild(d); });
  $('finishSub').textContent = `Tu as réussi les ${state.series} motifs.`;
  $('finish').hidden=false; burst();
  speak(['fini']);
}

/* ---------- partie ---------- */
function newRound(doSpeak=true){
  clearTimeout(advanceTimer);
  if(state.mode==='creer'){
    round = {code:'', model:null, given:0, answer:Array(LEN).fill(null), done:false};
  } else {
    const {code, model} = buildModel();
    const given = state.mode==='continuer' ? (code==='ABC'?5:4) : 0;
    round = {code, model, given, answer: model.map((c,i)=> i<given ? c : null), done:false};
  }
  $('feedback').textContent=''; $('feedback').className='feedback';
  render(); renderProgress();
  if(doSpeak) sayConsigne(); else stopAudio();
}
function sayConsigne(){ speak(['c_'+state.mode]); }

function render(){
  const code = state.mode==='creer' ? '' : round.code;
  $('codeTitle').textContent = code; $('codeTitle').hidden = !(code && state.letters);
  $('consigne').textContent = CONSIGNES[state.mode];
  $('lenGroup').style.visibility = state.mode==='creer' ? 'hidden':'visible';
  $('app').classList.toggle('lettered', state.letters);
  $('nextBtn').firstChild.textContent = state.mode==='creer' ? 'Recommencer ' : 'Passer ';
  const board = $('board'); board.innerHTML='';
  if(state.mode==='reproduire'){
    board.appendChild(trayEl(round.model, {label:'Modèle', static:true}));
    board.appendChild(trayEl(round.answer, {label:'À toi'}));
  } else board.appendChild(trayEl(round.answer, {}));
}

function trayEl(seq, opt){
  const wrap = document.createElement('div'); wrap.className='rowwrap';
  if(opt.label){ const l=document.createElement('div'); l.className='rowlabel'; l.textContent=opt.label; wrap.appendChild(l); }
  const tray = document.createElement('div'); tray.className='tray';
  const lets = lettersOf(state.mode==='creer' ? seq : (round.model||seq));
  const nextIdx = opt.static ? -1 : seq.indexOf(null);
  seq.forEach((id,i)=>{
    const b = document.createElement('button');
    b.className='slot';
    if(id){ b.appendChild(bearImg(id)); b.setAttribute('aria-label', byId[id].name); }
    else { b.classList.add('empty'); b.setAttribute('aria-label','case vide'); b.tabIndex=-1; }
    if(i===nextIdx && !round.done) b.classList.add('next');
    const editable = !opt.static && id && i>=round.given && !round.done;
    if(editable){ b.classList.add('placed'); b.onclick=()=>removeAt(i); b.title='Retirer'; }
    if(state.letters && id){ const s=document.createElement('span'); s.className='let'; s.textContent=lets[i]; b.appendChild(s); }
    if(!opt.static && lastPlaced===i) b.classList.add('pop');
    tray.appendChild(b);
  });
  wrap.appendChild(tray);
  return wrap;
}

function place(id){
  if(round.done) return;
  const i = round.answer.indexOf(null);
  if(i<0) return;
  speak([id]);
  round.answer[i]=id; lastPlaced=i;
  $('feedback').textContent=''; $('feedback').className='feedback';
  render(); lastPlaced=-1;
  if(round.answer.indexOf(null)<0) setTimeout(check, 900);
}
function removeAt(i){ if(round.done || i<round.given) return; round.answer[i]=null; render(); }
function undo(){
  if(round.done) return;
  for(let i=LEN-1;i>=round.given;i--){ if(round.answer[i]){ round.answer[i]=null; break; } }
  $('feedback').textContent=''; render();
}
function slotsOfAnswer(){ const t=[...document.querySelectorAll('.tray')]; return [...t[t.length-1].children]; }

function check(){
  const fb = $('feedback');
  if(state.mode==='creer'){
    const seq = round.answer; let period = 0;
    for(const p of [2,3]){ if(seq.every((c,i)=> i<p || c===seq[i-p]) && new Set(seq.slice(0,p)).size>1){ period=p; break; } }
    if(period){
      const code = lettersOf(seq.slice(0,period));
      round.done=true; render(); slotsOfAnswer().forEach(s=>s.classList.add('good'));
      fb.textContent=`Bravo ! C'est un motif ${code.join(' ')}.`; fb.className='feedback ok';
      $('codeTitle').textContent=code.join(''); $('codeTitle').hidden=false;
      speak(['bravo1','c_est',...code]); burst();
    } else {
      fb.textContent="Le motif doit se répéter."; fb.className='feedback no';
      speak(['pas_algo']);
    }
    return;
  }
  const wrong = [];
  round.answer.forEach((c,i)=>{ if(i>=round.given && c!==round.model[i]) wrong.push(i); });
  if(!wrong.length){
    round.done=true; state.won.push(round.model[0]);
    render(); renderProgress(); slotsOfAnswer().forEach(s=>s.classList.add('good'));
    fb.textContent='Bravo !'; fb.className='feedback ok'; burst();
    const last = state.won.length>=state.series;
    speak([pick(['bravo1','bravo2','bravo3'])], ()=>{
      advanceTimer = setTimeout(()=>{ last ? showFinish() : newRound(); }, 900);
    });
  } else {
    fb.textContent='Essaie encore !'; fb.className='feedback no';
    speak(['encore']);
    const slots = slotsOfAnswer(); wrong.forEach(i=>slots[i].classList.add('bad'));
    setTimeout(()=>{ if(round.done) return; wrong.forEach(i=>round.answer[i]=null); render(); }, 1300);
  }
}

/* ---------- confettis ---------- */
function burst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); Object.assign(cv.style,{position:'fixed',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:6});
  document.body.appendChild(cv); const dpr=devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const ps=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:6+Math.random()*10,c:pick(COLS).hex}));
  let t=0; (function f(){ ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=p.c;ctx.fill();});
    if(++t<110) requestAnimationFrame(f); else cv.remove(); })();
}

/* ---------- interface ---------- */
const pal=$('palette');
COLS.forEach(c=>{
  const g=document.createElement('div'); g.className='pgroup';
  SIZES.forEach(s=>{ const id=c.id+'-'+s.id; const b=document.createElement('button'); b.className='gom'; b.id='g-'+id; b.setAttribute('aria-label',byId[id].name); b.title=byId[id].name; b.appendChild(bearImg(id)); b.onclick=()=>place(id); g.appendChild(b); });
  pal.appendChild(g);
});

function setPressed(seg, attr, val){ [...$(seg).children].forEach(b=>b.setAttribute('aria-pressed', String(b.dataset[attr]===val))); }
$('modeSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; state.mode=b.dataset.mode; setPressed('modeSeg','mode',state.mode); newSeries(); };
$('lenSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; state.series=+b.dataset.len; setPressed('lenSeg','len',b.dataset.len); newSeries(); };
$('nextBtn').onclick=()=>newRound();
$('againBtn').onclick=newSeries;
$('undoBtn').onclick=undo;
$('sayBtn').onclick=sayConsigne;
$('voiceBtn').onclick=()=>{ state.voice=!state.voice; $('voiceBtn').setAttribute('aria-pressed',state.voice); $('voiceTxt').textContent=state.voice?'Voix':'Muet'; if(!state.voice) stopAudio(); };
$('lettersBtn').onclick=()=>{ state.letters=!state.letters; $('lettersBtn').setAttribute('aria-pressed',state.letters); render(); };

newRound(false);
</script>
